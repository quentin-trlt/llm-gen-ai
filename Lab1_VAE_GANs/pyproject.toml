[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab1-vae-gans-notebooks"
version = "0.1.0"
description = "Image generation notebook: autoencoders, VAEs and GANs on FashionMNIST"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[tool.setuptools]
py-modules = []
