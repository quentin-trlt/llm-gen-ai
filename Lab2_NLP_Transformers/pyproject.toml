[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab2-nlp-transformers-notebooks"
version = "0.1.0"
description = "Language processing and Transformer notebooks: tokenization, n-grams, embeddings, multi-head attention"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.4,<2",
  "nltk>=3.8,<4",
  "gensim>=4.3,<5",
  "tokenizers>=0.15,<1",
  "transformers>=4.40,<6",
  "sentence-transformers>=2.7,<7",
  "datasets>=2.18,<6",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[tool.setuptools]
py-modules = []
